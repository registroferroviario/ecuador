<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <link rel="icon" type="image/png" href="ico.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias - RegistroFerroviario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --bg-header: rgba(255, 255, 255, 0.95);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --accent-red: #e11d48;
            --border-color: #cbd5e1;
            --border-width: 2px;
            --shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
            /* Capa superpuesta para oscurecer/aclarar la foto de fondo */
            --bg-overlay: rgba(248, 250, 252, 0.92);
            --track-color: rgba(0, 0, 0, 0.08);
        }

        [data-theme="dark"] {
            --bg-body: #0b132b;
            --bg-card: #1c2541;
            --bg-header: rgba(17, 24, 39, 0.95);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent-red: #ef4444;
            --border-color: #334155;
            --border-width: 1px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            --bg-overlay: rgba(11, 19, 43, 0.92);
            --track-color: rgba(255, 255, 255, 0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* 1. FOTO DE FONDO OPACA */
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-body); 
            /* Cambia la URL entre url('') por tu propia imagen de vías/trenes si prefieres */
            background-image: linear-gradient(var(--bg-overlay), var(--bg-overlay)), 
                              url('ffcc/2001.jpg'); 
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
            color: var(--text-primary); 
            line-height: 1.6; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            position: relative;
        }
        
        .top-stripe { height: 8px; background: linear-gradient(90deg, #ffcc00 0%, #003399 50%, #cc0000 100%); }

        /* HEADER Y NAV */
        header {
            background-color: var(--bg-header);
            backdrop-filter: blur(8px);
            border-bottom: var(--border-width) solid var(--border-color);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--text-primary);
        }

        .logo-img { height: 40px; width: auto; }
        .logo-text { font-family: 'Outfit', sans-serif; font-size: 1.4rem; font-weight: 800; }

        nav { display: flex; align-items: center; gap: 1.5rem; }
        nav a { text-decoration: none; color: var(--text-secondary); font-weight: 600; font-size: 0.95rem; transition: color 0.2s; }
        nav a:hover { color: var(--accent-red); }

        .theme-toggle {
            background: none;
            border: var(--border-width) solid var(--border-color);
            border-radius: 20px;
            padding: 0.4rem 0.8rem;
            cursor: pointer;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.85rem;
        }

        /* 2. CENTRADO PERFECTO DE LA WEB */
        .container { 
            width: 100%;
            max-width: 850px; 
            margin: 2rem auto; 
            padding: 0 1.5rem; 
            flex: 1; 
            position: relative;
            z-index: 2;
        }

        /* 3. VÍAS DE DECORACIÓN EN LOS LATERALES (CSS PURO) */
        body::before, body::after {
            content: '';
            position: fixed;
            top: 0;
            bottom: 0;
            width: 32px;
            z-index: 1;
            background-image: 
                linear-gradient(90deg, transparent 4px, var(--track-color) 4px, var(--track-color) 8px, transparent 8px, transparent 24px, var(--track-color) 24px, var(--track-color) 28px, transparent 28px),
                repeating-linear-gradient(0deg, transparent, transparent 20px, var(--track-color) 20px, var(--track-color) 26px);
            opacity: 0.7;
            pointer-events: none;
        }
        body::before { left: 40px; }
        body::after { right: 40px; }

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .btn-volver { color: var(--accent-red); text-decoration: none; font-weight: 700; font-size: 0.95rem; }
        .btn-volver:hover { text-decoration: underline; }

        h1.titulo-seccion { 
            font-family: 'Outfit', sans-serif; 
            font-size: 2.3rem; 
            font-weight: 800; 
            color: var(--text-primary); 
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* TARJETAS DE NOTICIAS CON FOTOS GRANDES */
        .noticias-lista { display: flex; flex-direction: column; gap: 2rem; }

        .noticia-card {
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            border: var(--border-width) solid var(--border-color);
            border-left: 6px solid var(--accent-red);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .noticia-imagen {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .noticia-info { padding: 1.8rem; }
        .noticia-meta { color: var(--accent-red); font-weight: 700; font-size: 0.85rem; text-transform: uppercase; }
        .noticia-titulo { font-family: 'Outfit', sans-serif; font-size: 1.6rem; font-weight: 800; margin: 0.4rem 0; color: var(--text-primary); }
        .noticia-fecha { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.8rem; }
        .noticia-resumen { font-size: 1rem; color: var(--text-secondary); margin-bottom: 1.2rem; }

        .btn-leer { display: inline-block; color: var(--accent-red); font-weight: 700; font-size: 0.95rem; text-decoration: none; }
        .btn-leer:hover { text-decoration: underline; }

      
        footer {
            background-color: var(--bg-header);
            border-top: var(--border-width) solid var(--border-color);
            padding: 2rem;
            text-align: center;
            margin-top: 4rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            position: relative;
            z-index: 2;
        }

        /* Ocultar vías laterales en pantallas pequeñas/móviles */
        @media (max-width: 1000px) {
            body::before, body::after { display: none; }
        }

        @media (max-width: 650px) {
            .noticia-imagen { height: 220px; }
            header { padding: 1rem; }
            .header-container { flex-direction: column; gap: 1rem; }
        }
    </style>
</head>
<body>

    <div class="top-stripe"></div>

    <!-- HEADER Y NAV -->
    <header>
        <div class="header-container">
            <a href="index.html" class="logo-container">
                <img src="img/logo.png" alt="RegistroFerroviario" class="logo-img" onerror="this.style.display='none'">
                <span class="logo-text">RegistroFerroviario</span>
            </a>
            
            <nav>
                <a href="index.html">Inicio</a>
                <a href="cochesjaula.html">Coches Jaula</a>
                <a href="cochescut4.html">CUT4</a>
                <a href="noticias.html">Noticias</a>
                <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">🌙 Oscuro</button>
            </nav>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container">
        <div class="top-bar">
            <a href="javascript:history.back()" class="btn-volver">← Regresar</a>
        </div>

        <h1 class="titulo-seccion">
            <span>🚂</span> Novedades y Actualidad
        </h1>
        
        <div class="noticias-lista" id="contenedor-noticias">
            <p>Cargando publicaciones...</p>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 RegistroFerroviario. Todos los derechos reservados.</p>
    </footer>

    <!-- SCRIPT TEMA Y CARGA DE DATOS -->
    <script>
        const themeBtn = document.getElementById('themeBtn');
        const currentTheme = localStorage.getItem('theme') || 'light';

        document.documentElement.setAttribute('data-theme', currentTheme);
        updateThemeButton(currentTheme);

        function toggleTheme() {
            const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            updateThemeButton(theme);
        }

        function updateThemeButton(theme) {
            themeBtn.innerHTML = theme === 'dark' ? '☀️ Claro' : '🌙 Oscuro';
        }

        fetch('seccion_noticias.json')
            .then(response => response.json())
            .then(noticias => {
                const contenedor = document.getElementById('contenedor-noticias');
                contenedor.innerHTML = '';
                
                noticias.forEach(noticia => {
                    contenedor.innerHTML += `
                        <article class="noticia-card">
                            <img src="${noticia.imagen}" class="noticia-imagen" alt="${noticia.titulo}">
                            <div class="noticia-info">
                                <div class="noticia-meta">${noticia.autor}</div>
                                <h2 class="noticia-titulo">${noticia.titulo}</h2>
                                <div class="noticia-fecha">Publicado el ${noticia.fecha}</div>
                                <p class="noticia-resumen">${noticia.resumen}</p>
                                <a href="noticia.html?id=${noticia.id}" class="btn-leer">Leer entrada completa →</a>
                            </div>
                        </article>
                    `;
                });
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('contenedor-noticias').innerHTML = '<p>Error al cargar el listado de noticias.</p>';
            });
    </script>
</body>
</html>
